<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>dock</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#f3f1ec">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="dock">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<style>
  :root{
    --bg:#f3f1ec; --card:#fffefb; --ink:#3a3630; --dim:#8b8378;
    --line:rgba(150,138,122,.22); --accent:#7a8b76; --danger:#b0736f;
    --radius:14px; --drawer:236px;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#17181a; --card:#202225; --ink:#e6e2da; --dim:#8f8a80;
      --line:rgba(200,190,175,.14); --accent:#9db396; --danger:#c98d88;
    }
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    background:var(--bg);color:var(--ink);
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    min-height:100vh;overflow-x:hidden;
  }

  /* ------------------------------------------------------------- header */
  header{
    display:flex;align-items:center;gap:12px;
    padding:calc(env(safe-area-inset-top) + 12px) 18px 10px;
    position:sticky;top:0;background:var(--bg);z-index:20;
  }
  header h1{font-size:18px;font-weight:600;letter-spacing:.3px}
  #menu{
    border:0;background:transparent;color:var(--ink);cursor:pointer;
    width:30px;height:30px;display:flex;flex-direction:column;justify-content:center;
    gap:5px;padding:0;flex:none;
  }
  #menu i{display:block;height:1.7px;background:currentColor;border-radius:2px;
    transition:transform .22s ease,opacity .22s ease}
  #menu i:nth-child(1){width:18px}
  #menu i:nth-child(2){width:13px}
  #menu i:nth-child(3){width:16px}
  .drawer-open #menu i:nth-child(1){transform:translateY(6.7px) rotate(45deg);width:18px}
  .drawer-open #menu i:nth-child(2){opacity:0}
  .drawer-open #menu i:nth-child(3){transform:translateY(-6.7px) rotate(-45deg);width:18px}

  /* ------------------------------------------------------------- drawer */
  #drawer{
    position:fixed;top:0;left:0;bottom:0;width:var(--drawer);z-index:40;
    background:var(--card);border-right:1px solid var(--line);
    padding:calc(env(safe-area-inset-top) + 58px) 12px 20px;
    transform:translateX(-100%);transition:transform .24s cubic-bezier(.4,0,.2,1);
    display:flex;flex-direction:column;
  }
  .drawer-open #drawer{transform:translateX(0)}
  #scrim{
    position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.28);
    opacity:0;pointer-events:none;transition:opacity .24s ease;
  }
  .drawer-open #scrim{opacity:1;pointer-events:auto}
  .drawer-item{
    display:flex;align-items:center;gap:11px;width:100%;
    background:transparent;border:0;color:var(--ink);font:inherit;font-size:15px;
    padding:11px 12px;border-radius:10px;cursor:pointer;text-align:left;
  }
  .drawer-item:hover{background:var(--bg)}
  .drawer-item.active{background:var(--bg);color:var(--accent);font-weight:600}
  .drawer-icon{font-size:18px;width:22px;text-align:center;flex:none}
  .drawer-foot{margin-top:auto;font-size:11.5px;color:var(--dim);padding:0 12px}

  main{padding:6px 18px calc(env(safe-area-inset-bottom) + 40px);max-width:640px;margin:0 auto}

  /* -------------------------------------------------------------- clock */
  .clock{padding:26px 4px 30px;text-align:center}
  .clock-time{
    font-size:64px;font-weight:200;letter-spacing:-1px;line-height:1;
    font-variant-numeric:tabular-nums;
  }
  .clock-sec{font-size:22px;font-weight:300;color:var(--dim);margin-left:7px;
    vertical-align:6px}
  .clock-date{font-size:14px;color:var(--dim);margin-top:10px;letter-spacing:1px}
  .clock-since{font-size:12px;color:var(--accent);margin-top:5px;letter-spacing:2px}

  /* --------------------------------------------------------- components */
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px;margin-bottom:14px;
  }
  .card h2{
    font-size:12px;font-weight:600;letter-spacing:1px;text-transform:uppercase;
    color:var(--dim);margin-bottom:14px;
  }
  input,select,textarea{
    font:inherit;width:100%;padding:10px 12px;border:1px solid var(--line);
    border-radius:10px;background:var(--bg);color:var(--ink);
  }
  textarea{resize:vertical;min-height:88px;line-height:1.6}
  input.big{font-size:30px;font-weight:600;text-align:right;padding:14px 12px}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
  .field{display:block;margin-bottom:12px}
  .field span{display:block;font-size:13px;color:var(--dim);margin-bottom:6px}
  button{
    font:inherit;font-size:14px;padding:9px 14px;border-radius:10px;
    border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;
  }
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.danger{color:var(--danger);border-color:transparent;padding:4px 8px}
  .result{font-size:34px;font-weight:600;text-align:right;margin:16px 0;letter-spacing:-.5px}
  .hint{font-size:12.5px;color:var(--dim);line-height:1.55;margin-top:10px}
  .empty{color:var(--dim);font-size:14px;text-align:center;padding:26px 0}
  .row{display:flex;gap:10px;align-items:center}
  .row+.row{margin-top:10px}
</style>
</head>
<body>
  <div id="scrim"></div>
  <aside id="drawer"></aside>

  <header>
    <button id="menu" aria-label="菜单"><i></i><i></i><i></i></button>
    <h1 id="title">dock</h1>
  </header>

  <main id="root"></main>

<script type="module">
  import { createStorage } from './core/storage.js';
  import { Shell } from './core/app.js';

  /* A deployment drops in config.local.js — gitignored, never committed —
   * and it wins. Without one you get the public config: local storage,
   * sample data, no endpoints. Everything else on disk is identical
   * between a private deployment and a fresh clone. */
  let config;
  try {
    config = (await import('./config.local.js')).default;
  } catch {
    config = (await import('./config.js')).default;
  }

  new Shell({
    config,
    storage: createStorage(config),
    apps: config.apps,
    root: document.getElementById('root')
  }).start();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' })
        .catch(e => console.warn('sw register failed', e));
    });
  }
</script>
</body>
</html>
