<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>直到大地变成一颗酸橙</title>
<meta name="theme-color" content="#5b8ed6">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  body{
    /* 底色沿用画面顶部的蓝，图片没加载出来时不会白闪一下 */
    background:#3f6ea8;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    user-select:none;
  }
  #stage{position:fixed;inset:0}

  /* 背景图：等比裁剪填满，横图放到竖屏上会裁掉左右两边 */
  #bg{
    position:absolute;inset:0;z-index:-2;
    background:url('./assets/bg.webp?v=4') center center / cover no-repeat;
  }
  /* 底部压一层淡雾，让白色的路和信封不至于糊在水面的碎光里 */
  #haze{
    position:absolute;left:0;right:0;bottom:0;height:42%;z-index:-1;pointer-events:none;
    background:linear-gradient(180deg,rgba(190,216,236,0) 0%,rgba(196,220,238,.34) 45%,rgba(210,230,244,.62) 100%);
  }

  /* 板块的底：一层不透明的渐变，进了任何板块就一直亮着。
     背景和内容分开，两个板块交叉淡的时候背后是实的，
     不会因为两层各自半透明而漏出主页那张画。 */
  #panelBg{
    position:absolute;inset:0;z-index:1;
    opacity:0;pointer-events:none;transition:opacity .38s ease;
    background:linear-gradient(180deg,#4d7fc9 0%,#5b8ed6 22%,#84b3e2 55%,#bcd9ee 78%,#e4f0f8 100%);
  }
  #panelBg.on{opacity:1}

  /* 板块内容层，自己不带背景 */
  .panel{
    position:absolute;inset:0;z-index:2;
    opacity:0;pointer-events:none;transition:opacity .3s ease;
    padding:calc(env(safe-area-inset-top) + 4vh) 22px 34vh;
    overflow-y:auto;-webkit-overflow-scrolling:touch;
  }
  .panel.on{opacity:1;pointer-events:auto}
  .panel h2{
    color:#fff;font-size:15px;font-weight:600;letter-spacing:3px;
    opacity:.72;text-align:center;
    text-shadow:0 2px 8px rgba(30,60,110,.3);
    margin-bottom:20px;
  }

  /* ---- 日历 ---- */
  .cal-head{display:flex;align-items:center;gap:6px;margin-bottom:14px}
  .cal-title{
    flex:1;text-align:center;color:#fff;font-size:16px;font-weight:600;
    letter-spacing:2px;text-shadow:0 2px 8px rgba(30,60,110,.3);
  }
  .cal-nav{
    border:0;background:rgba(255,255,255,.4);color:#2f4a6d;
    width:32px;height:32px;border-radius:50%;font-size:17px;line-height:1;
    cursor:pointer;flex:none;
  }
  .cal-week{
    display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px;
  }
  .cal-week span{
    text-align:center;font-size:11px;color:rgba(255,255,255,.72);letter-spacing:1px;
  }
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .cal-cell{
    position:relative;aspect-ratio:1/1.34;
    border:1px solid rgba(255,255,255,.42);border-radius:10px;
    background:rgba(255,255,255,.2);
    display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
    padding:3px 0 0;cursor:pointer;font:inherit;overflow:hidden;
  }
  .cal-cell.out{opacity:.34}
  .cal-cell.today{border-color:rgba(255,255,255,.95);border-width:1.6px}
  .cal-cell.period{background:rgba(214,140,146,.34);border-color:rgba(214,140,146,.5)}
  .cal-cell.ovu{background:rgba(150,190,170,.28);border-color:rgba(150,190,170,.45)}
  .cal-num{font-size:11px;color:#2f4a6d;line-height:1.2}
  .cal-mood{width:60%;max-width:26px;margin-top:1px}
  .cal-marks{position:absolute;bottom:3px;display:flex;gap:3px}
  .cal-marks i{width:4px;height:4px;border-radius:50%;display:block}
  .mk-anni{background:#e2b45c}
  .mk-note{background:rgba(47,74,109,.55)}
  .cal-legend{display:flex;gap:16px;justify-content:center;margin-top:12px}
  .cal-legend span{font-size:11px;color:rgba(47,74,109,.7);display:flex;align-items:center;gap:5px}
  .lg{width:10px;height:10px;border-radius:3px;display:inline-block}
  .lg.period{background:rgba(214,140,146,.6)}
  .lg.ovu{background:rgba(150,190,170,.55)}

  /* 当天的抽屉 */
  .sheet{
    position:fixed;inset:0;z-index:60;background:rgba(30,50,80,.38);
    display:flex;align-items:center;justify-content:center;padding:20px;
    backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);
  }
  .sheet[hidden]{display:none}
  .sheet-card{
    width:100%;max-width:440px;background:#f2f6fb;
    border-radius:20px;padding:20px;
    max-height:78vh;overflow-y:auto;
    box-shadow:0 18px 46px rgba(20,40,70,.3);
    animation:rise .26s cubic-bezier(.2,.9,.3,1);
  }
  @keyframes rise{from{transform:scale(.96);opacity:.3}to{transform:none;opacity:1}}
  .sheet-date{font-size:13px;color:#5b7a9d;letter-spacing:1px;margin-bottom:14px}
  .sheet-moods{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:16px}
  .mood-pick{
    border:1px solid transparent;background:transparent;border-radius:12px;
    padding:6px 2px;cursor:pointer;display:flex;flex-direction:column;
    align-items:center;gap:3px;font:inherit;
  }
  .mood-pick img{width:28px}
  .mood-pick span{font-size:10px;color:#5b7a9d}
  .mood-pick.on{background:#fff;border-color:rgba(120,160,200,.45)}
  .sheet-field{display:block;margin-bottom:14px}
  .sheet-field span{display:block;font-size:12px;color:#5b7a9d;margin-bottom:6px}
  .sheet-field textarea,.sheet-field input{
    width:100%;font:inherit;font-size:14px;color:#2f4a6d;
    border:1px solid rgba(120,160,200,.34);border-radius:12px;
    padding:10px 12px;background:#fff;resize:vertical;
  }
  .sheet-row{display:flex;gap:10px}
  .sheet-btn{
    flex:1;font:inherit;font-size:14px;padding:11px;border-radius:12px;
    border:0;background:#7a9ec4;color:#fff;cursor:pointer;
  }
  .sheet-btn.ghost{background:rgba(120,160,200,.18);color:#4a6b90}

  /* ---- 打卡 ---- */
  .checks{display:flex;flex-direction:column;gap:12px}
  .check{
    background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.66);
    border-radius:16px;padding:14px 16px;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  }
  .check-top{display:flex;align-items:center;gap:10px}
  .check-icon{font-size:22px;line-height:1}
  .check-name{font-size:15px;color:#2f4a6d;font-weight:600;flex:1}
  .check-count{
    font-size:13px;color:#5b7a9d;font-variant-numeric:tabular-nums;
    background:rgba(255,255,255,.6);border-radius:20px;padding:2px 10px;
  }
  .dots{display:flex;gap:9px;margin-top:12px}
  .dot{
    width:26px;height:26px;border-radius:50%;cursor:pointer;
    border:1.6px solid rgba(70,110,160,.4);background:rgba(255,255,255,.34);
    transition:transform .16s cubic-bezier(.34,1.5,.5,1),background .2s ease,border-color .2s ease;
    display:flex;align-items:center;justify-content:center;
    font-size:13px;color:transparent;
  }
  .dot:active{transform:scale(.86)}
  .dot.done{background:#7fb08a;border-color:#6f9e7a;color:#fff}
  .dot.wide{width:auto;padding:0 12px;border-radius:14px;font-size:12.5px;color:#43648c}
  .dot.wide.done{color:#fff}
  .week{display:flex;gap:5px;margin-top:14px;align-items:flex-end}
  .week span{
    flex:1;text-align:center;font-size:10px;color:#5b7a9d;
  }
  .week i{
    display:block;height:5px;border-radius:3px;margin-bottom:4px;
    background:rgba(255,255,255,.42);
  }
  .week i.on{background:#7fb08a}
  .panel-note{
    font-size:12px;color:rgba(47,74,109,.62);line-height:1.7;
    margin-top:18px;text-align:center;
  }

  /* 标题 */
  #title{
    position:absolute;left:50%;z-index:3;
    transform:translateX(-50%);
    top:calc(env(safe-area-inset-top) + 4.5vh);
    width:min(74vw,340px);
    filter:drop-shadow(0 2px 10px rgba(30,60,110,.28));
    pointer-events:none;
    transition:opacity .32s ease;
  }
  #title.hide{opacity:0}

  /* 装饰 */
  /* 拼贴。只在主页出现，跟标题一起淡。
     每片各自慢慢飘，周期都不一样，所以不会整体一起晃。 */
  #deco{position:absolute;inset:0;z-index:2;pointer-events:none;transition:opacity .32s ease}
  #deco.hide{opacity:0}
  #deco img{position:absolute;filter:drop-shadow(0 2px 6px rgba(30,60,110,.18))}
  .d23{top:15vh;left:5vw;width:64px;opacity:.85;animation:drift 13s ease-in-out infinite}
  .d22{top:11vh;right:2vw;width:104px;opacity:.5;animation:drift 17s ease-in-out infinite reverse}
  .d19{top:25.5vh;left:50%;margin-left:-76px;width:152px;opacity:.5;animation:drift 21s ease-in-out infinite}
  .d16{top:33vh;left:2vw;width:86px;opacity:.55;animation:drift 15s ease-in-out infinite reverse}
  .d20{top:30vh;right:3vw;width:92px;opacity:.45;animation:drift 19s ease-in-out infinite}
  .d18{top:53vh;left:4vw;width:78px;opacity:.5;animation:drift 16s ease-in-out infinite}
  .d21{top:57vh;right:4vw;width:92px;opacity:.45;animation:drift 23s ease-in-out infinite reverse}
  .d17{top:62vh;left:50%;margin-left:-62px;width:124px;opacity:.5;animation:drift 18s ease-in-out infinite}
  #bunnies{width:118px;top:38vh;left:6vw;opacity:.55;animation:drift 16s ease-in-out infinite}
  #stars{width:120px;top:22vh;right:5vw;opacity:.7;animation:twinkle 4.5s ease-in-out infinite}
  @keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(7px,-9px)}}
  @keyframes twinkle{0%,100%{opacity:.35}50%{opacity:.85}}

  /* 洁哥 */
  #ang{
    position:absolute;left:0;top:0;z-index:7;width:min(60vw,268px);
    transform-origin:50% 50%;will-change:transform;pointer-events:none;
    filter:drop-shadow(0 10px 18px rgba(30,60,110,.22));
  }
  #angFlip{transform-origin:50% 50%;transition:transform .18s ease}
  /* 逐帧播放：一张横向雪碧图，五帧，用 steps 走。
     不用动图 WebP —— iOS 上它时灵时不灵，这个到处都能播。 */
  #angSprite{
    width:100%;aspect-ratio:1/1;
    background-image:url('./assets/ride_sheet.webp?v=4');
    background-repeat:no-repeat;
    background-size:500% 100%;
    /* jump-none 才会取到 0/25/50/75/100 这五个位置。
       普通的 steps(5) 取的是 0/20/40/60/80，每帧都停在两帧中间，看着就是抖。
       背景图放大到 5 倍之后，百分比是按"容器与图片的差值"算的，不是图宽。 */
    animation:ride 1s steps(5,jump-none) infinite;
  }
  @keyframes ride{from{background-position-x:0%}to{background-position-x:100%}}

  /* 公路 */
  /* 贴着屏幕底边，只给 iPhone 那道home横条让出位置 */
  #roadWrap{position:absolute;left:0;right:0;z-index:5;bottom:calc(env(safe-area-inset-bottom) + 4px);height:30%;pointer-events:none}
  #road{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .road-line{fill:none;stroke:#fff;stroke-linecap:round}
  .road-glow{stroke-width:11;opacity:.28;filter:blur(5px)}
  .road-main{stroke-width:3.2;opacity:.95}
  .road-dash{stroke-width:2;opacity:.55;stroke-dasharray:2 15}

  /* 信封 */
  .letter{
    position:absolute;z-index:6;width:56px;margin-left:-28px;margin-top:-52px;
    cursor:pointer;will-change:transform;
    transition:transform .45s cubic-bezier(.34,1.4,.5,1),filter .3s ease;
    filter:drop-shadow(0 3px 5px rgba(30,60,110,.25));
  }
  .letter img{width:100%;display:block;pointer-events:none}
  .letter.up{
    animation:float 2.6s ease-in-out infinite;
    filter:drop-shadow(0 10px 14px rgba(30,60,110,.3));
  }
  @keyframes float{
    0%,100%{transform:translateY(-26px) rotate(-3deg)}
    50%{transform:translateY(-36px) rotate(3deg)}
  }
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div>
  <div id="haze"></div>

  <div id="panelBg"></div>

  <section class="panel" id="panel0">
    <h2></h2>
    <div id="calRoot"></div>
  </section>
  <section class="panel" id="panel1"><h2></h2></section>
  <section class="panel" id="panel2"><h2></h2></section>
  <section class="panel" id="panel3"><h2></h2></section>


  <div id="deco">
    <img class="d23" src="./assets/deco/d23.webp?v=1" alt="">
    <img class="d22" src="./assets/deco/d22.webp?v=1" alt="">
    <img class="d19" src="./assets/deco/d19.webp?v=1" alt="">
    <img class="d16" src="./assets/deco/d16.webp?v=1" alt="">
    <img class="d20" src="./assets/deco/d20.webp?v=1" alt="">
    <img class="d18" src="./assets/deco/d18.webp?v=1" alt="">
    <img class="d21" src="./assets/deco/d21.webp?v=1" alt="">
    <img class="d17" src="./assets/deco/d17.webp?v=1" alt="">
  </div>

  <img id="title" src="./assets/title.webp?v=4" alt="直到大地变成一颗酸橙">


  <div id="ang"><div id="angFlip"><div id="angSprite" role="img" aria-label="安洁莉娜"></div></div></div>

  <div id="roadWrap">
    <svg id="road" xmlns="http://www.w3.org/2000/svg">
      <path id="pGlow" class="road-line road-glow"></path>
      <path id="pMain" class="road-line road-main"></path>
      <path id="pDash" class="road-line road-dash"></path>
    </svg>
  </div>
</div>

<script type="module">
"use strict";

/* 存储走 dock 那一层，跟别的应用同一套。
   现在是本地实现，以后换成接口版，这里一行都不用改。 */
import { LocalStore } from '../../core/storage.js';
const store = new LocalStore();

/* 有 config.local.js 就用它，没有就用公开那份。
   缺哪个字段就补哪个，不用整份照抄。 */
import baseConfig from './config.js';
import { mountCalendar } from './calendar.js';
let CFG = baseConfig;
try {
  const local = (await import('./config.local.js')).default;
  CFG = { ...baseConfig, ...local };
} catch { /* 没有本地配置，用公开版 */ }

const stage = document.getElementById('stage');
const ang   = document.getElementById('ang');
const flip  = document.getElementById('angFlip');
const road  = document.getElementById('road');
const wrap  = document.getElementById('roadWrap');
const pMain = document.getElementById('pMain');

const STOPS = [0.13, 0.38, 0.63, 0.88];   // 四个站点在路上的位置
const letters = [];
let stopPts = [];
let active = -1;
let busy = false;

/* 洁哥的当前状态。位置指她的中心点。 */
/* 不做镜像：她朝左是素材本来的样子，翻来翻去反而乱。 */
let pos = { x: 0, y: 0, s: 1 };

function apply() {
  ang.style.transform = `translate(${pos.x}px, ${pos.y}px) translate(-50%,-50%) scale(${pos.s})`;
}

/* ---------------------------------------------------------------- 布局 */

function homePoint() {
  return { x: innerWidth * 0.5, y: innerHeight * 0.44 };
}

function buildRoad() {
  const w = wrap.clientWidth, h = wrap.clientHeight;
  road.setAttribute('viewBox', `0 0 ${w} ${h}`);
  road.setAttribute('width', w);
  road.setAttribute('height', h);

  /* 一条手画感的弯路：左低右高再落下来。压到底边附近，信封才不会浮在半空 */
  const y = h * 0.84;
  const d = `M ${-w * 0.04} ${y + h * 0.14}
             C ${w * 0.18} ${y - h * 0.10}, ${w * 0.34} ${y + h * 0.20}, ${w * 0.52} ${y + h * 0.02}
             S ${w * 0.86} ${y - h * 0.16}, ${w * 1.04} ${y + h * 0.06}`;
  ['pGlow', 'pMain', 'pDash'].forEach(id => document.getElementById(id).setAttribute('d', d));

  const L = pMain.getTotalLength();
  const box = wrap.getBoundingClientRect();
  stopPts = STOPS.map(t => {
    const p = pMain.getPointAtLength(L * t);
    return { x: p.x + box.left, y: p.y + box.top };
  });

  letters.forEach((el, i) => {
    el.style.left = stopPts[i].x + 'px';
    el.style.top  = stopPts[i].y + 'px';
  });
}

/* -1 表示回主页 */
const panels = [0, 1, 2, 3].map(i => document.getElementById('panel' + i));
const panelBg = document.getElementById('panelBg');
const titleImg = document.getElementById('title');
const decoBox = document.getElementById('deco');

function showPanel(i) {
  panels.forEach((p, k) => p.classList.toggle('on', k === i));
  panelBg.classList.toggle('on', i !== -1);   // 只在回主页时才熄
  titleImg.classList.toggle('hide', i !== -1);
  decoBox.classList.toggle('hide', i !== -1);
}

function makeLetters() {
  STOPS.forEach((_, i) => {
    const el = document.createElement('div');
    el.className = 'letter';
    const icon = (CFG.stopIcons && CFG.stopIcons[i]) || 'letter.webp';
    el.innerHTML = `<img src="./assets/${icon}?v=1" alt="">`;
    el.style.setProperty('--i', i);
    el.addEventListener('click', () => onLetter(i));
    stage.appendChild(el);
    letters.push(el);
  });
}

/* ---------------------------------------------------------------- 动画 */

const easeIn  = t => t * t * t;
const easeOut = t => 1 - Math.pow(1 - t, 3);

function tween(to, ms, ease) {
  return new Promise(res => {
    const from = { x: pos.x, y: pos.y, s: pos.s };
    const t0 = performance.now();
    (function step(now) {
      const k = Math.min(1, (now - t0) / ms);
      const e = ease(k);
      pos.x = from.x + (to.x - from.x) * e;
      pos.y = from.y + (to.y - from.y) * e;
      pos.s = from.s + ((to.s ?? from.s) - from.s) * e;
      apply();
      k < 1 ? requestAnimationFrame(step) : res();
    })(t0);
  });
}

/* 素材本身画的就是朝右（脸和扶把在右，尾焰在左后方），所以朝右不翻，朝左才镜像。 */
let facing = 'right';
function face(dir) {
  facing = dir;
  flip.style.transform = `scaleX(${dir === 'left' ? -1 : 1})`;
}

/* 飞出：朝哪边就往哪边出去。 */
function exit() {
  const x = facing === 'right' ? innerWidth + 300 : -300;
  return tween({ x, y: pos.y - 40 }, 440, easeIn);
}

/* 进场：从飞出去的反方向回来，这样她一直是朝前飞的。 */
function enter(y, scale) {
  pos.x = facing === 'right' ? -300 : innerWidth + 300;
  pos.y = y; pos.s = scale;
  apply();
}

/* 站点之间不出屏幕，直接拱一条弧跳过去。飞得越远弧越高。 */
const easeInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

function arcTo(to, ms) {
  return new Promise(res => {
    const from = { x: pos.x, y: pos.y, s: pos.s };
    const cx = (from.x + to.x) / 2;
    const cy = Math.min(from.y, to.y) - Math.max(52, Math.abs(to.x - from.x) * 0.32);
    const t0 = performance.now();
    (function step(now) {
      const k = Math.min(1, (now - t0) / ms);
      const e = easeInOut(k), u = 1 - e;
      pos.x = u * u * from.x + 2 * u * e * cx + e * e * to.x;
      pos.y = u * u * from.y + 2 * u * e * cy + e * e * to.y;
      pos.s = from.s + (to.s - from.s) * e;
      apply();
      k < 1 ? requestAnimationFrame(step) : res();
    })(t0);
  });
}

/* 停在信封上方时轻轻上下浮 */
let bobTimer = null;
function startBob(base) {
  stopBob();
  const t0 = performance.now();
  (function loop(now) {
    pos.y = base + Math.sin((now - t0) / 780) * 5;
    apply();
    bobTimer = requestAnimationFrame(loop);
  })(t0);
}
function stopBob() { if (bobTimer) cancelAnimationFrame(bobTimer), bobTimer = null; }

async function onLetter(i) {
  if (busy) return;
  busy = true;
  stopBob();

  const goingHome = active === i;
  const hopping   = !goingHome && active !== -1;      // 站点之间，直接跳

  /* 板块切换跟飞行同时开始：主页淡出、目标板块淡入。
     板块之间是两层各自淡，中间那一下就是平滑过渡。 */
  showPanel(goingHome ? -1 : i);

  const target = goingHome
    ? { ...homePoint(), s: 1 }
    : { x: stopPts[i].x, y: stopPts[i].y - 108, s: 0.4 };

  /* 先定朝向：下一站在她右边就朝右，在左边就朝左。飞出和进场都跟着它。 */
  face(target.x >= pos.x ? 'right' : 'left');

  if (goingHome) {
    active = -1;
    letters[i].classList.remove('up');
  } else {
    letters.forEach(el => el.classList.remove('up'));
    letters[i].classList.add('up');
    active = i;
  }

  if (hopping) {
    await arcTo(target, 700);
  } else {                                            // 进出首页才飞出屏幕
    await exit();
    enter(target.y, target.s);
    await tween(target, 800, easeOut);
  }
  if (active !== -1) startBob(target.y);

  busy = false;
}

/* ---------------------------------------------------------------- 启动 */

function layout() {
  buildRoad();
  if (active === -1) {
    const h = homePoint();
    pos.x = h.x; pos.y = h.y; pos.s = 1;
  } else {
    const p = stopPts[active];
    pos.x = p.x; pos.y = p.y - 108; pos.s = 0.4;
  }
  apply();
}

/* 板块标题和那句话都从配置来 */
CFG.panels.forEach((p, i) => {
  const h = document.querySelector(`#panel${i} h2`);
  if (h) h.textContent = p.name;
});

makeLetters();
face('right');
layout();
mountCalendar(document.getElementById('calRoot'), { cfg: CFG, store });
/* 首屏排版还没完成时算出来的尺寸是 0，下一帧和图片加载完各补算一次。 */
requestAnimationFrame(layout);
addEventListener('load', layout);
addEventListener('resize', layout);
addEventListener('orientationchange', () => setTimeout(layout, 120));
</script>
</body>
</html>
