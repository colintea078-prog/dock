<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>dock</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#f3f1ec">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="dock">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<style>
  :root{
    --bg:#f3f1ec; --card:#fffefb; --ink:#3a3630; --dim:#8b8378;
    --line:rgba(150,138,122,.22); --accent:#7a8b76; --danger:#b0736f;
    --radius:14px;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#17181a; --card:#202225; --ink:#e6e2da; --dim:#8f8a80;
      --line:rgba(200,190,175,.14); --accent:#9db396; --danger:#c98d88;
    }
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    background:var(--bg);color:var(--ink);
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    min-height:100vh;
    padding:env(safe-area-inset-top) env(safe-area-inset-right)
            env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  header{
    display:flex;align-items:center;gap:10px;
    padding:14px 18px 10px;position:sticky;top:0;background:var(--bg);z-index:5;
  }
  header h1{font-size:19px;font-weight:600;letter-spacing:.3px}
  #back{
    border:0;background:transparent;color:var(--dim);font-size:22px;
    cursor:pointer;line-height:1;padding:2px 4px;
  }
  #back:hover{color:var(--ink)}
  main{padding:4px 18px 40px;max-width:640px;margin:0 auto}

  /* home grid */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:14px}
  .tile{
    display:flex;flex-direction:column;align-items:center;gap:8px;
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px 6px 14px;cursor:pointer;color:var(--ink);font:inherit;
    transition:transform .12s ease;
  }
  .tile:active{transform:scale(.96)}
  .tile-icon{font-size:28px;line-height:1}
  .tile-name{font-size:13px;color:var(--dim)}

  /* app screens */
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px;margin-bottom:14px;
  }
  .card h2{
    font-size:12px;font-weight:600;letter-spacing:1px;text-transform:uppercase;
    color:var(--dim);margin-bottom:14px;
  }
  input,select,textarea{
    font:inherit;width:100%;padding:10px 12px;border:1px solid var(--line);
    border-radius:10px;background:var(--bg);color:var(--ink);
  }
  input.big{font-size:30px;font-weight:600;text-align:right;padding:14px 12px}
  input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
  .field{display:block;margin-bottom:12px}
  .field span{display:block;font-size:13px;color:var(--dim);margin-bottom:6px}
  button{
    font:inherit;font-size:14px;padding:9px 14px;border-radius:10px;
    border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;
  }
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.danger{color:var(--danger);border-color:transparent;padding:4px 8px}
  .result{
    font-size:34px;font-weight:600;text-align:right;margin:16px 0;
    letter-spacing:-.5px;
  }
  .hint{font-size:12.5px;color:var(--dim);line-height:1.55;margin-top:10px}
  .empty{color:var(--dim);font-size:14px;text-align:center;padding:28px 0}
  .foot{color:var(--dim);font-size:12px;text-align:center;margin-top:26px}
  .row{display:flex;gap:10px;align-items:center}
  .row+.row{margin-top:10px}
</style>
</head>
<body>
  <header>
    <button id="back" hidden aria-label="返回">‹</button>
    <h1 id="title">dock</h1>
  </header>
  <main id="root"></main>

<script type="module">
  import config from './config.js';
  import { createStorage } from './core/storage.js';
  import { Shell } from './core/app.js';

  const shell = new Shell({
    config,
    storage: createStorage(config),
    apps: config.apps,
    root: document.getElementById('root')
  });
  shell.start();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' })
        .catch(e => console.warn('sw register failed', e));
    });
  }
</script>
</body>
</html>
