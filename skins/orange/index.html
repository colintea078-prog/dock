<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>直到大地变成一颗酸橙</title>
<meta name="theme-color" content="#5b8ed6">
<link rel="manifest" href="./manifest.json?v=73">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="酸橙">
<link rel="apple-touch-icon" href="./assets/icons/icon-192.png?v=73">
<style>
  /* 拉丁字体自带，两个系统才长一样。中文仍旧交给系统。
     四款都在仓库里，换一个只用改下面 --num 里的第一个名字：
       Fredoka       圆头圆脑，数字最清楚
       Grandstander  手绘感最强，笔画带点抖
       Gaegu         韩系手写，最轻最随意
       Baloo 2       圆润饱满，偏粗
     全部 SIL Open Font License。 */
  @font-face{font-family:'Fredoka';
    src:url('./assets/fonts/fredoka-latin.woff2') format('woff2');
    font-weight:400 600;font-display:swap}
  @font-face{font-family:'Grandstander';
    src:url('./assets/fonts/grandstander-latin.woff2') format('woff2');
    font-weight:400 700;font-display:swap}
  @font-face{font-family:'Gaegu';
    src:url('./assets/fonts/gaegu-latin.woff2') format('woff2');
    font-weight:700;font-display:swap}
  @font-face{font-family:'Baloo 2';
    src:url('./assets/fonts/baloo2-latin.woff2') format('woff2');
    font-weight:400 700;font-display:swap}
  @font-face{font-family:'Quicksand';
    src:url('./assets/fonts/quicksand-latin.woff2') format('woff2');
    font-weight:400 700;font-display:swap}

  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  body{
    /* 底色沿用画面顶部的蓝，图片没加载出来时不会白闪一下 */
    background:#3f6ea8;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    user-select:none;
  }
  #stage{position:fixed;inset:0}

  /* 背景图：等比裁剪填满，横图放到竖屏上会裁掉左右两边 */
  #bg{
    position:absolute;inset:0;z-index:-2;
    background:url('./assets/bg.webp?v=73') center center / cover no-repeat;
  }
  /* 底部压一层淡雾，让白色的路和信封不至于糊在水面的碎光里 */
  #haze{
    position:absolute;left:0;right:0;bottom:0;height:42%;z-index:-1;pointer-events:none;
    background:linear-gradient(180deg,rgba(190,216,236,0) 0%,rgba(196,220,238,.34) 45%,rgba(210,230,244,.62) 100%);
    transition:opacity .38s ease;
  }

  /* 板块的底：一层不透明的渐变，进了任何板块就一直亮着。
     背景和内容分开，两个板块交叉淡的时候背后是实的，
     不会因为两层各自半透明而漏出主页那张画。 */
  #panelBg{
    position:absolute;inset:0;z-index:1;
    opacity:0;pointer-events:none;transition:opacity .38s ease;
    /* 背景不自己画，直接把下面那张画糊掉 —— backdrop-filter 模糊的是
       自己身下的东西。这样板块和主页永远是同一张背景，不会对不上。 */
    background:linear-gradient(180deg,rgba(214,234,248,.08) 0%,rgba(228,242,252,.12) 50%,rgba(240,248,253,.16) 100%);
    /* 上下两头把这一层自己淡掉，蒙版和模糊一起收 ——
       整块铺到边会有一条硬边，看着像贴了张膜。 */
    -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 9%,#000 88%,transparent 100%);
    mask-image:linear-gradient(180deg,transparent 0,#000 9%,#000 88%,transparent 100%);
    backdrop-filter:blur(4px) saturate(1.03);
    -webkit-backdrop-filter:blur(4px) saturate(1.03);
  }
  /* 浏览器不支持背景模糊时，蒙版加厚一点，字才看得清 */
  @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
    #panelBg{background:linear-gradient(180deg,rgba(206,229,246,.62) 0%,rgba(228,242,252,.7) 100%)}
  }
  #panelBg.on{opacity:1}
  /* 板块开着的时候把底部那层雾收掉 —— 它是给公路用的，
     铺在板块下面只是又压厚一层。 */
  body.in-panel #haze{opacity:0}

  /* 板块内容层，自己不带背景 */
  .panel{
    position:absolute;inset:0;z-index:2;
    opacity:0;pointer-events:none;transition:opacity .3s ease;
    padding:calc(env(safe-area-inset-top) + 4vh) 22px 34vh;
    overflow-y:auto;-webkit-overflow-scrolling:touch;
  }
  .panel.on{opacity:1;pointer-events:auto}
  .panel h2[hidden]{display:none}
  .panel h2{
    display:flex;align-items:baseline;justify-content:center;gap:10px;
    margin-bottom:18px;
    text-shadow:0 2px 10px rgba(25,60,105,.32);
  }
  .panel h2 .en{
    font-family:var(--num);
    font-size:26px;letter-spacing:4px;
    color:#fff;opacity:.95;
  }
  .panel h2 .cn{
    font-family:var(--round);
    font-size:17px;letter-spacing:3px;font-weight:600;
    color:rgba(255,255,255,.92);
  }
  .panel .hand{font-family:var(--hand);font-size:16px;color:#a8c8db;
    text-align:center;display:block;margin:-8px 0 16px}

  /* ---- 日历 ---- 毛玻璃外框，白纸嵌在中间 */
  :root{
    --sky:#6CC7E8;
    --ocean:#237FC5;
    --cloud:#FFFFFF;
    --mint:#8DD8D0;
    --sunny:#FFD85A;
    --ink:#3d6b8c;
    --pink:#f3b7c7;
    --paper:#fbfeff;

    --hand:'Snell Roundhand','Bradley Hand','Segoe Script',cursive;
    /* 中文交给系统：iOS 苹方，安卓思源／鸿蒙。
       圆体只对拉丁生效（SF Pro Rounded 没有汉字）。
       日文圆体不能排在苹方前面 —— 中日汉字有些字形不同（直、骨、每、化），
       它会先接走这些字，一句中文里混进几个日式写法。 */
    --round:ui-rounded,'SF Pro Rounded',-apple-system,'PingFang SC',
      system-ui,'HarmonyOS Sans SC','Source Han Sans SC',sans-serif;
    /* 数字和星期用系统手写体。iOS 自带 Noteworthy / Chalkboard，
       安卓退回圆体，都不用下载字体文件。 */
    /* Quicksand 放第一位，两个系统才一致；后面几个是它没加载出来时的退路 */
    --num:'Gaegu','Noteworthy','Chalkboard SE',var(--round);
  }

  /* 外框：透明毛玻璃。糊的是它自己身下那层，也就是被板块虚化过的天。 */
  .cal-card{
    position:relative;
    font-family:var(--round);
    border-radius:26px;
    padding:0 12px 14px;
    transform:rotate(-0.6deg);
    background:linear-gradient(160deg,rgba(255,255,255,.34),rgba(226,242,252,.22));
    border:1px solid rgba(255,255,255,.5);
    backdrop-filter:blur(16px) saturate(1.12);
    -webkit-backdrop-filter:blur(16px) saturate(1.12);
    box-shadow:
      0 16px 34px rgba(65,140,180,.2),
      inset 0 1px 0 rgba(255,255,255,.55);
    overflow:visible;
  }



  /* 顶部月份区域 */
  .cal-top{
    position:relative;
    padding:18px 56px 16px;
    text-align:center;
  }

  .cal-men{
    font-family:var(--num);
    font-size:26px;
    color:var(--sunny);
    letter-spacing:5px;
    line-height:1.1;
    text-shadow:0 1px 2px rgba(150,110,20,.35);
  }
  .cal-mon{
    font-family:var(--num);
    font-size:62px;
    line-height:.95;
    color:var(--sunny);
    font-weight:700;
    letter-spacing:2px;
    text-shadow:0 2px 3px rgba(150,110,20,.35);
  }
  .cal-myear{
    margin-top:2px;
    font-family:var(--num);
    font-size:15px;
    color:#f3cf72;
    letter-spacing:4px;
  }

  /* 翻页：一左一右，贴着月份两边 */
  .cal-nav{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:44px;
    height:44px;
    border:0;
    border-radius:50%;
    background:linear-gradient(150deg,#ffe27a,var(--sunny));
    color:#c98a12;
    font-size:26px;
    font-weight:700;
    line-height:1;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    box-shadow:0 4px 12px rgba(190,140,20,.32);
  }
  .cal-nav::after{
    content:"";
    position:absolute;
    inset:4px;
    border-radius:50%;
    border:1.4px dashed rgba(255,255,255,.72);
  }
  .cal-nav:active{transform:translateY(-50%) scale(.92)}
  .cal-today{
    position:absolute;left:50%;transform:translateX(-50%);
    bottom:-6px;border:0;cursor:pointer;
    font-family:var(--round);font-size:11.5px;letter-spacing:1px;
    color:#3d7ba8;background:rgba(255,255,255,.72);
    border-radius:20px;padding:4px 14px;
    box-shadow:0 2px 8px rgba(50,110,160,.2);
  }
  .cal-today[hidden]{display:none}
  .cal-nav[data-go="-1"]{left:4px}
  .cal-nav[data-go="1"]{right:4px}

  /* 日期区：一整块白纸嵌在水彩里 */
  .cal-body{
    padding:14px 10px 26px;
    /* 白纸也透一点，让下面那片天透上来一层 */
    background:rgba(255,255,255,.58);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    border-radius:20px;
    box-shadow:0 2px 10px rgba(70,130,170,.12);
  }
  .cal-week{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    margin-bottom:8px;
  }
  .cal-week span{
    text-align:center;
    font-family:var(--num);
    font-size:12px;
    letter-spacing:.5px;
    color:#7fb4d4;
  }
  /* 划线，不是一格一个盒子。竖线靠每格的右边框，最右一列不画；
     横线靠下边框，最后一行不画。 */
  .cal-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:0;
  }

  /* 每一天 */
  .cal-cell{
    position:relative;
    aspect-ratio:1/1.24;
    border:0;
    border-right:1px solid rgba(150,200,228,.3);
    border-bottom:1px solid rgba(150,200,228,.3);
    border-radius:0;
    background:transparent;
    padding:3px 0 0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;   /* 数字贴着格子顶部 */
    cursor:pointer;
    font:inherit;
  }
  .cal-cell:nth-child(7n){border-right:0}
  .cal-cell:nth-child(n+36){border-bottom:0}
  .cal-cell.out{opacity:.22}

  .cal-num{
    position:relative;
    z-index:2;
    width:27px;
    height:27px;
    display:flex;
    justify-content:center;
    align-items:center;
    border-radius:50%;
    color:var(--ink);
    font-family:var(--num);
    font-size:16px;
    font-weight:600;
  }
  /* 今天：整格浅蓝，不是给数字套个圈 */
  .cal-cell.today{
    background:linear-gradient(160deg,rgba(150,214,240,.46),rgba(190,231,247,.32));
  }
  .cal-cell.today .cal-num{color:#1f6ea8;font-weight:700}
  .cal-cell.period .cal-num{
    color:#cc8794;
    box-shadow:inset 0 0 0 2px rgba(243,183,199,.8);
  }
  .cal-cell.ovu .cal-num{
    color:#55a99a;
    box-shadow:inset 0 0 0 2px rgba(141,216,208,.9);
  }

  /* 倒计时里记的事，贴在格子右上角 */
  /* 标签横着放在数字下面，占满格宽才看得出写的什么 */
  .cal-ev{
    display:block;width:94%;height:auto;margin:0 auto;
    pointer-events:none;
    filter:drop-shadow(0 1px 2px rgba(40,90,140,.24));
  }
  i.cal-ev{
    width:5px;height:5px;border-radius:50%;
    background:#f0a94f;
  }
  .cal-evline{
    display:flex;gap:6px;flex-wrap:wrap;margin:-8px 0 14px;
  }
  .cal-evline span{
    display:inline-flex;align-items:center;gap:6px;
    max-width:100%;min-width:0;
    font-size:12.5px;color:#4a6b90;background:#eaf4fc;
    border-radius:20px;padding:3px 11px 3px 5px;
  }
  /* 贴纸原图是 520 宽的长条，不限高就会把整张卡撑出横向滚动。
     28 是够看清上面写什么、又不至于喧宾夺主的高度。 */
  .cal-evline img{height:28px;width:auto;display:block;flex:none}

  .cal-back{
    position:absolute;
    top:3px;
    left:50%;
    transform:translateX(-50%);
    width:32px;
    height:32px;
    z-index:1;
  }
  .cal-back.cloudy{color:#ffd3e0}
  .cal-back.starry{color:#ffe7a0}
  .cal-back.hearty{color:#ffd8e1}

  .cal-slot{
    width:100%;
    min-height:15px;
    display:flex;
    justify-content:center;
    align-items:center;
    margin-top:1px;
  }
  /* 心情在左上角，之前 14 太小认不出画的是什么 */
  .cal-mood{
    position:absolute;top:0;left:1px;z-index:3;
    width:21px;height:21px;object-fit:contain;
    pointer-events:none;
  }



  /* 弹窗。挂在 body 上，居中，层级要高过公路和洁哥。 */
  .sheet{
    position:fixed;inset:0;z-index:60;background:rgba(30,50,80,.38);
    display:flex;align-items:center;justify-content:center;padding:16px;
    backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);
  }
  .sheet[hidden]{display:none}
  .sheet-card{
    width:100%;max-width:min(440px,calc(100vw - 32px));background:#fbfdff;
    border-radius:20px;padding:20px;
    max-height:78vh;overflow-y:auto;
    box-shadow:0 18px 46px rgba(20,40,70,.3);
    animation:rise .26s cubic-bezier(.2,.9,.3,1);
    font-family:var(--round);
  }
  @keyframes rise{from{transform:scale(.96);opacity:.3}to{transform:none;opacity:1}}
  .sheet-date{font-size:13px;color:#5b7a9d;letter-spacing:1px;margin-bottom:14px}
  .sheet-moods{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:16px}
  .mood-pick{
    border:1px solid transparent;background:transparent;border-radius:12px;
    padding:6px 2px;cursor:pointer;display:flex;flex-direction:column;
    align-items:center;gap:3px;font:inherit;
  }
  .mood-pick img{width:28px}
  .mood-pick span{font-size:10px;color:#5b7a9d}
  .mood-pick.on{background:#fff;border-color:rgba(120,160,200,.45)}
  .sheet-field{display:block;margin-bottom:14px}
  .sheet-field span{display:block;font-size:12px;color:#5b7a9d;margin-bottom:6px}
  /* 输入框字号不能小于 16 —— 小了 iOS 一点就把整页放大 */
  .sheet-field textarea,.sheet-field input{
    width:100%;min-width:0;max-width:100%;font:inherit;font-size:16px;color:#2f4a6d;
    -webkit-appearance:none;appearance:none;
    border:1px solid rgba(120,160,200,.34);border-radius:12px;
    padding:10px 12px;background:#fff;resize:vertical;
  }
  .sheet-row{display:flex;gap:10px}
  .sheet-btn{
    flex:1;font:inherit;font-size:14px;padding:11px;border-radius:12px;
    border:0;background:#7a9ec4;color:#fff;cursor:pointer;
  }
  .sheet-btn.ghost{background:rgba(120,160,200,.18);color:#4a6b90}

  /* ---- 日期备忘录 ---- */
  .dt-tags{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 16px;padding-top:4px}
  .dt-tag{
    font-family:var(--round);font-size:12.5px;padding:6px 14px;border-radius:20px;
    cursor:pointer;border:1.4px solid transparent;
    background:var(--c,rgba(255,255,255,.5));color:#4a6b90;
    display:inline-flex;align-items:center;gap:5px;
  }
  .dt-tag.on{border-color:#fff;box-shadow:0 3px 10px rgba(90,150,190,.22);font-weight:600}
  /* 贴纸版：按钮本身不画任何东西，图就是按钮。
     选中不靠调透明度 —— 压暗了就看不清写的什么。改成浮起来。 */
  .dt-tag.pic{
    padding:0;border:0;background:none;box-shadow:none;
    opacity:.94;transition:transform .2s cubic-bezier(.34,1.4,.5,1),
      filter .2s ease,opacity .2s ease;
  }
  .dt-tag.pic.on{
    opacity:1;transform:translateY(-5px) scale(1.04);
    filter:drop-shadow(0 6px 10px rgba(30,80,130,.38));
  }
  .dt-tag.pic img{height:38px;width:auto;display:block}
  .dt-tag.pic img.round{height:44px}
  /* 底框跟着内容长高：切成九宫格，四角保持原样，四边拉伸。
     整张图直接拉伸的话，角上那些小星星会被扯歪。 */
  /* 底框。这张图左右是宽水彩带、上下只有一条细线，四边不对称，
     所以九宫格的切法也得跟着不对称：左右切厚、上下切薄。 */
  /* 列表外面不再套框，框下放到每一条上 */
  .dt-frame{margin-bottom:8px}
  .dt-list{display:flex;flex-direction:column;gap:10px}
  /* 每一条就是那张卡片本身。图是不透明的，中间本来就有奶白的芯，
     不用再补填充。四角圆一下，把图外面那点白边裁掉。 */
  .dt-card{
    font-family:var(--round);
    display:flex;align-items:center;gap:10px;
    width:100%;aspect-ratio:1000/322;text-align:left;
    border:0;border-radius:20px;overflow:hidden;
    background:url('./assets/pack/frame.webp?v=73') center/100% 100% no-repeat;
    padding:0 8%;cursor:pointer;
    box-shadow:0 6px 16px rgba(40,90,140,.18);
  }
  .dt-card.now{filter:brightness(1.06) saturate(1.1)}
  .dt-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
  .dt-name{font-size:15px;color:#2f4a6d;font-weight:600;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dt-sub{font-size:11.5px;color:#5b7a9d}
  .dt-chips{display:flex;gap:4px;flex:none}
  .dt-chip{
    font-size:11px;color:#4a6b90;background:var(--c,rgba(255,255,255,.66));
    border-radius:20px;padding:3px 9px;flex:none;
    display:inline-flex;align-items:center;gap:4px;white-space:nowrap;
  }
  .dt-chip.pic{
    background:none;padding:0;height:26px;width:auto;flex:none;
    filter:drop-shadow(0 1px 3px rgba(40,90,140,.22));
  }
  .dt-days{
    font-size:16px;font-weight:600;color:#2f4a6d;flex:none;
    font-variant-numeric:tabular-nums;min-width:62px;text-align:right;
  }
  .dt-empty{
    color:rgba(255,255,255,.75);font-size:13.5px;text-align:center;
    line-height:2;padding:36px 0;
  }
  .dt-add[hidden]{display:none}
  .dt-add.dragging{transform:scale(1.12);
    box-shadow:0 12px 26px rgba(30,60,110,.4);cursor:grabbing}
  /* 黄色帆布纽扣：布面、缝线、四个扣眼 */
  .dt-add{
    position:fixed;right:20px;bottom:calc(34vh + env(safe-area-inset-bottom));
    touch-action:none;                 /* 不然拖它会把页面一起拖 */
    transition:transform .16s ease,box-shadow .16s ease;
    z-index:12;width:54px;height:54px;border-radius:50%;cursor:pointer;
    border:1px solid rgba(190,150,40,.35);
    color:#a9761a;font-size:27px;line-height:1;font-weight:700;
    font-family:var(--num);
    display:flex;align-items:center;justify-content:center;
    /* 布纹：两组极细的斜纹交叉，压在黄色底上 */
    background:
      repeating-linear-gradient(45deg,rgba(255,255,255,.16) 0 1px,transparent 1px 3px),
      repeating-linear-gradient(-45deg,rgba(160,120,20,.08) 0 1px,transparent 1px 3px),
      radial-gradient(circle at 34% 30%,#ffe89a,#ffd85a 62%,#f0c341 100%);
    box-shadow:
      0 8px 18px rgba(150,110,20,.32),
      inset 0 -2px 4px rgba(160,120,20,.22),
      inset 0 2px 3px rgba(255,255,255,.5);
  }
  /* 缝线一圈 */
  .dt-add::before{
    content:"";position:absolute;inset:5px;border-radius:50%;

  #deco{position:absolute;inset:0;z-index:2;pointer-events:none;transition:opacity .32s ease}

  .dc-pen{

    font-family:var(--round);font-size:12.5px;letter-spacing:2px;
    color:#fff;
    text-shadow:0 1px 4px rgba(30,70,120,.6),0 0 10px rgba(30,70,120,.4);
    opacity:0;transition:opacity .28s ease;
  }
  .letter-name.on{opacity:1}

  /* 公路 */
  /* 贴着屏幕底边，只给 iPhone 那道home横条让出位置 */
  #roadWrap{position:absolute;left:0;right:0;z-index:5;bottom:calc(env(safe-area-inset-bottom) + 4px);height:30%;pointer-events:none}
  #road{position:absolute;inset:0;width:100%;height:100%;overflow:visible}

  .road-dash{stroke-width:2;opacity:.55;stroke-dasharray:2 15}

  /* 信封 */
  .letter{
    position:absolute;z-index:6;width:56px;margin-left:-28px;margin-top:-52px;
    cursor:pointer;will-change:transform;
    transition:transform .45s cubic-bezier(.34,1.4,.5,1),filter .3s ease;
    filter:drop-shadow(0 3px 5px rgba(30,60,110,.25));
  }
  .letter img{width:100%;display:block;pointer-events:none}
  /* 板块名字：平时不在，选中了才淡进来。
     它不跟着信封飘 —— 名字晃着看不清，而且飘的是信封，名字只是个标签。 */
  .letter-name{
    position:absolute;top:56px;left:50%;
    transform:translateX(-50%);
    white-space:nowrap;pointer-events:none;
    font-family:var(--round);font-size:12.5px;letter-spacing:2px;
    color:#fff;
    text-shadow:0 1px 4px rgba(30,70,120,.55),0 0 10px rgba(30,70,120,.35);
    opacity:0;transition:opacity .28s ease;

  .letter.up .letter-name{opacity:1}
  .letter.up{
    animation:float 2.6s ease-in-out infinite;
    filter:drop-shadow(0 10px 14px rgba(30,60,110,.3));
  }
  @keyframes float{
    0%,100%{transform:translateY(-26px) rotate(-3deg)}
    50%{transform:translateY(-36px) rotate(3deg)}
  }
</style>

let busy = false;

/* 洁哥的当前状态。位置指她的中心点。 */
/* 不做镜像：她朝左是素材本来的样子，翻来翻去反而乱。 */
let pos = { x: 0, y: 0, s: 1 };

function apply() {
  ang.style.transform = `translate(${pos.x}px, ${pos.y}px) translate(-50%,-50%) scale(${pos.s})`;
}

/* ---------------------------------------------------------------- 布局 */

function homePoint() {
  return { x: innerWidth * 0.5, y: innerHeight * 0.44 };
}

function buildRoad() {
  const w = wrap.clientWidth, h = wrap.clientHeight;
  road.setAttribute('viewBox', `0 0 ${w} ${h}`);
  road.setAttribute('width', w);
  road.setAttribute('height', h);

  /* 一条手画感的弯路：左低右高再落下来。压到底边附近，信封才不会浮在半空 */
  const y = h * 0.84;
  const d = `M ${-w * 0.04} ${y + h * 0.14}
             C ${w * 0.18} ${y - h * 0.10}, ${w * 0.34} ${y + h * 0.20}, ${w * 0.52} ${y + h * 0.02}
             S ${w * 0.86} ${y - h * 0.16}, ${w * 1.04} ${y + h * 0.06}`;
  ['pGlow', 'pMain', 'pDash'].forEach(id => document.getElementById(id).setAttribute('d', d));

  const L = pMain.getTotalLength();
  const box = wrap.getBoundingClientRect();
  stopPts = STOPS.map(t => {
    const p = pMain.getPointAtLength(L * t);
    return { x: p.x + box.left, y: p.y + box.top };
  });

  letters.forEach((el, i) => {
    el.style.left = stopPts[i].x + 'px';
    el.style.top  = stopPts[i].y + 'px';
  });
  names.forEach((el, i) => {
    el.style.left = stopPts[i].x + 'px';
    el.style.top  = stopPts[i].y + 'px';
  });
}

/* -1 表示回主页 */
const panels = [0, 1, 2, 3].map(i => document.getElementById('panel' + i));
const panelBg = document.getElementById('panelBg');
const titleImg = document.getElementById('title');
const decoBox = document.getElementById('deco');

function showPanel(i) {
  panels.forEach((p, k) => p.classList.toggle('on', k === i));
  panelBg.classList.toggle('on', i !== -1);   // 只在回主页时才熄
  document.body.classList.toggle('in-panel', i !== -1);
  titleImg.classList.toggle('hide', i !== -1);
  decoBox.classList.toggle('hide', i !== -1);
  if (typeof deco !== 'undefined') deco.setVisible(i === -1);
}

function makeLetters() {
  STOPS.forEach((_, i) => {
    const el = document.createElement('div');
    el.className = 'letter';
    const icon = (CFG.stopIcons && CFG.stopIcons[i]) || 'letter.webp';
    const name = (CFG.panels[i] && CFG.panels[i].name) || '';
    el.innerHTML = `<img src="./assets/${icon}?v=73" alt="${name}">`;

    /* 名字单独一层，钉在站点上，不放进信封里 ——
       信封一直在飘，装在里面的东西会被一起带着走，
       而外层是绕自己中心转的，子元素在偏移位置上划的是一段弧，
       靠反向动画补不回来。拿出来就彻底不动了。 */
    const tag = document.createElement('span');
    tag.className = 'letter-name';
    tag.textContent = name;
    stage.appendChild(tag);
    names.push(tag);
    el.style.setProperty('--i', i);
    el.addEventListener('click', () => onLetter(i));
    stage.appendChild(el);
    letters.push(el);
  });
}

/* ---------------------------------------------------------------- 动画 */

const easeIn  = t => t * t * t;
const easeOut = t => 1 - Math.pow(1 - t, 3);

function tween(to, ms, ease) {
  return new Promise(res => {
    const from = { x: pos.x, y: pos.y, s: pos.s };
    const t0 = performance.now();
    (function step(now) {
      const k = Math.min(1, (now - t0) / ms);
      const e = ease(k);
      pos.x = from.x + (to.x - from.x) * e;
      pos.y = from.y + (to.y - from.y) * e;
      pos.s = from.s + ((to.s ?? from.s) - from.s) * e;
      apply();
      k < 1 ? requestAnimationFrame(step) : res();
    })(t0);
  });
}

/* 素材本身画的就是朝右（脸和扶把在右，尾焰在左后方），所以朝右不翻，朝左才镜像。 */
let facing = 'right';
function face(dir) {
  facing = dir;
  flip.style.transform = `scaleX(${dir === 'left' ? -1 : 1})`;
}

/* 飞出：朝哪边就往哪边出去。 */
function exit() {
  const x = facing === 'right' ? innerWidth + 300 : -300;
  return tween({ x, y: pos.y - 40 }, 440, easeIn);
}

/* 进场：从飞出去的反方向回来，这样她一直是朝前飞的。 */
function enter(y, scale) {
  pos.x = facing === 'right' ? -300 : innerWidth + 300;
  pos.y = y; pos.s = scale;
  apply();
}

/* 站点之间不出屏幕，直接拱一条弧跳过去。飞得越远弧越高。 */
const easeInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

function arcTo(to, ms) {
  return new Promise(res => {
    const from = { x: pos.x, y: pos.y, s: pos.s };
    const cx = (from.x + to.x) / 2;
    const cy = Math.min(from.y, to.y) - Math.max(52, Math.abs(to.x - from.x) * 0.32);
    const t0 = performance.now();
    (function step(now) {
      const k = Math.min(1, (now - t0) / ms);
      const e = easeInOut(k), u = 1 - e;
      pos.x = u * u * from.x + 2 * u * e * cx + e * e * to.x;
      pos.y = u * u * from.y + 2 * u * e * cy + e * e * to.y;
      pos.s = from.s + (to.s - from.s) * e;
      apply();
      k < 1 ? requestAnimationFrame(step) : res();
    })(t0);
  });
}

/* 停在信封上方时轻轻上下浮 */
let bobTimer = null;
function startBob(base) {
  stopBob();
  const t0 = performance.now();
  (function loop(now) {
    pos.y = base + Math.sin((now - t0) / 780) * 5;
    apply();
    bobTimer = requestAnimationFrame(loop);
  })(t0);
}
function stopBob() { if (bobTimer) cancelAnimationFrame(bobTimer), bobTimer = null; }

async function onLetter(i) {
  if (busy) return;
  busy = true;
  stopBob();

  const goingHome = active === i;
  const hopping   = !goingHome && active !== -1;      // 站点之间，直接跳

  /* 板块切换跟飞行同时开始：主页淡出、目标板块淡入。
     板块之间是两层各自淡，中间那一下就是平滑过渡。 */
  showPanel(goingHome ? -1 : i);

  const target = goingHome
    ? { ...homePoint(), s: 1 }
    : { x: stopPts[i].x, y: stopPts[i].y - 108, s: 0.4 };

  /* 先定朝向：下一站在她右边就朝右，在左边就朝左。飞出和进场都跟着它。 */
  face(target.x >= pos.x ? 'right' : 'left');

  if (goingHome) {
    active = -1;
    letters[i].classList.remove('up');
    names.forEach(el => el.classList.remove('on'));
  } else {
    letters.forEach(el => el.classList.remove('up'));
    letters[i].classList.add('up');
    names.forEach((el, k) => el.classList.toggle('on', k === i));
    active = i;
  }

  if (hopping) {
    await arcTo(target, 700);
  } else {                                            // 进出首页才飞出屏幕
    await exit();
    enter(target.y, target.s);
    await tween(target, 800, easeOut);
  }
  if (active !== -1) startBob(target.y);

  busy = false;
}

/* ---------------------------------------------------------------- 启动 */

function layout() {
  buildRoad();
  if (active === -1) {
    const h = homePoint();
    pos.x = h.x; pos.y = h.y; pos.s = 1;
  } else {
    const p = stopPts[active];
    pos.x = p.x; pos.y = p.y - 108; pos.s = 0.4;
  }
  apply();
}

/* 板块标题和那句话都从配置来 */
CFG.panels.forEach((p, i) => {
  const h = document.querySelector(`#panel${i} h2`);
  if (!h) return;
  /* 只留英文。中文标题跟下面的内容重复，而且挤掉了留白。
     没写英文的板块才退回用中文名。 */
  /* 标题默认不显示，但留在结构里供读屏软件用 */
  h.innerHTML = `<span class="en">${p.en || p.name}</span>`;
  h.setAttribute('aria-label', p.name);
  h.hidden = !CFG.panelTitle;
});

/* 自己的 service worker。updateViaCache:'none' 保证 sw.js 本身永远走网络，
   不然改了它浏览器可能还在跑旧的。 */
if ('serviceWorker' in navigator) {
  addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js?v=73', { updateViaCache: 'none' })
      .catch(e => console.warn('sw register failed', e));
  });
}

makeLetters();
face('right');
layout();
mountCalendar(document.getElementById('calRoot'), { cfg: CFG, store });
mountDates(document.getElementById('dtRoot'), { cfg: CFG, store });
mountLedger(document.getElementById('ledRoot'), { cfg: CFG, store });
mountChecklist(document.getElementById('ckRoot'), { cfg: CFG, store });
const deco = mountDeco(decoBox, { cfg: CFG, store });
/* 首屏排版还没完成时算出来的尺寸是 0，下一帧和图片加载完各补算一次。 */
requestAnimationFrame(layout);
addEventListener('load', layout);
addEventListener('resize', layout);
addEventListener('orientationchange', () => setTimeout(layout, 120));
</script>
</body>
